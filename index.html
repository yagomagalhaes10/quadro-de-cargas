<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quadro de Cargas — Mavaular</title>
<style>
  :root {
    --board-bg: #12151a;
    --panel-bg: #1c2129;
    --panel-bg-alt: #242a34;
    --panel-bg-hover: #2c3340;
    --divider: #2c3340;
    --text-primary: #f3f1ea;
    --text-secondary: #8b93a1;
    --amber: #ffb300;
    --green: #46b880;
    --red: #e56a6a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--board-bg);
    color: var(--text-primary);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--divider);
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .topbar-stats {
    padding-left: 20px;
    border-left: 1px solid var(--divider);
  }

  .brand-title {
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    display: block;
  }

  .brand-sub {
    font-size: 0.78rem;
    color: var(--text-secondary);
    letter-spacing: 0.03em;
  }

  .sync-info {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  #dayLabel {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-secondary);
    display: inline-block;
  }
  .status-dot.ok { background: var(--green); box-shadow: 0 0 0 0 rgba(70,184,128,0.6); animation: pulse 2s infinite; }
  .status-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--red); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(70,184,128,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(70,184,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(70,184,128,0); }
  }

  .icon-btn-top {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-secondary);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 1rem;
    cursor: pointer;
  }
  .icon-btn-top:hover { background: var(--panel-bg-alt); color: var(--text-primary); }

  .dia-picker {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .dia-input {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--text-primary);
    background: var(--panel-bg-alt);
    border: 1px solid var(--divider);
    border-radius: 6px;
    width: 56px;
    height: 28px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .dia-input::-webkit-outer-spin-button,
  .dia-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .dia-input:focus {
    outline: 2px solid var(--text-primary);
    outline-offset: 1px;
  }

  .view-toggle {
    display: flex;
    border: 1px solid var(--divider);
    border-radius: 6px;
    overflow: hidden;
  }
  .view-toggle-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    padding: 5px 10px;
    cursor: pointer;
  }
  .view-toggle-btn.active {
    background: var(--panel-bg-hover);
    color: var(--text-primary);
    font-weight: 700;
  }
  .view-toggle-btn:hover { color: var(--text-primary); }

  /* ---------- Error banner ---------- */
  .error-banner {
    background: #331616;
    border: 1px solid #7a2a2a;
    color: #ffb3b3;
    padding: 10px 16px;
    border-radius: 8px;
    margin: 14px 24px 0;
    font-size: 0.85rem;
  }

  /* ---------- Config screen ---------- */
  .config-screen {
    max-width: 480px;
    margin: 12vh auto;
    padding: 28px;
    background: var(--panel-bg);
    border-radius: 12px;
    text-align: left;
  }
  .config-screen h2 {
    margin-top: 0;
    font-size: 1.1rem;
    letter-spacing: 0.03em;
  }
  .config-screen p {
    color: var(--text-secondary);
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .config-screen input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--divider);
    background: var(--panel-bg-alt);
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .config-screen button {
    background: var(--amber);
    color: #1a1300;
    border: none;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .config-screen button:hover { filter: brightness(1.08); }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    padding: 20px 24px 32px;
  }
  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; }
  }

  .column {
    background: var(--panel-bg);
    border-left: 4px solid var(--accent, var(--amber));
    border-radius: 10px;
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .column-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .col-stats {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-line {
    font-size: 0.75rem;
    font-family: var(--mono);
    color: var(--text-secondary);
  }
  .stat-line.pending {
    color: var(--amber);
    font-weight: 700;
  }

  .col-title {
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 0.92rem;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: var(--panel-bg-alt);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card.loaded { opacity: 0.5; }
  .card.loaded .descricao { text-decoration: line-through; }

  .card.in-progress {
    border-left: 3px solid var(--amber);
    background: var(--panel-bg-hover);
  }

  .card.called {
    border-left: 3px solid var(--amber);
    animation: blinkCalled 1s infinite;
  }
  @keyframes blinkCalled {
    0%, 100% { background: var(--panel-bg-alt); }
    50% { background: rgba(255, 179, 0, 0.30); }
  }

  .card.arrived {
    border-left: 3px solid #5b8def;
    background: rgba(91, 141, 239, 0.12);
  }

  .badge-arrived {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #eaf0ff;
    background: #5b8def;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .badge-called {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #1a1300;
    background: var(--amber);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    animation: blinkText 1s infinite;
  }
  @keyframes blinkText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .badge-progress {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--amber);
    white-space: nowrap;
  }

  .group-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 2px 0 -4px;
  }

  .card.flip { animation: flipIn 0.35s ease; }
  @keyframes flipIn {
    from { transform: rotateX(70deg); opacity: 0; }
    to { transform: rotateX(0deg); opacity: 1; }
  }

  .position-badge {
    font-family: var(--mono);
    font-weight: 800;
    font-size: 0.85rem;
    color: var(--accent, var(--amber));
    background: var(--panel-bg-hover);
    border: 1px solid var(--accent, var(--amber));
    border-radius: 6px;
    width: 32px;
    height: 26px;
    text-align: center;
    flex-shrink: 0;
    padding: 0;
    -moz-appearance: textfield;
  }
  .position-badge::-webkit-outer-spin-button,
  .position-badge::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .position-badge:focus {
    outline: 2px solid var(--text-primary);
    outline-offset: 1px;
  }

  .carga-chip {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-secondary);
    background: var(--panel-bg-hover);
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .descricao {
    /* nunca encolhe abaixo de ~150px: quando falta espaço, o peso e os botões descem para a linha de baixo */
    flex: 1 1 150px;
    font-weight: 700;
    font-size: 0.9rem;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .actions { margin-left: auto; }

  .peso {
    font-family: var(--mono);
    font-weight: 800;
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    background: var(--panel-bg-hover);
    border: none;
    color: var(--text-primary);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--divider); }

  .loaded-toggle {
    font-size: 0.78rem;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 2px 2px;
    user-select: none;
  }
  .loaded-toggle:hover { color: var(--text-primary); }

  .loaded-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .empty-state {
    color: var(--text-secondary);
    font-size: 0.82rem;
    padding: 10px 4px;
    text-align: center;
  }

  /* ---------- Botão de notificações ---------- */
  .notif-btn {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-secondary);
    border-radius: 6px;
    height: 30px;
    padding: 0 10px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .notif-btn:hover { background: var(--panel-bg-alt); color: var(--text-primary); }
  .notif-btn.pending { border-color: var(--amber); color: var(--amber); animation: blinkText 1.4s infinite; }
  .notif-btn.on { border-color: var(--green); color: var(--green); }
  .notif-btn.off { border-color: var(--red); color: var(--red); }

  .notif-wrap { position: relative; display: inline-flex; gap: 4px; }
  .notif-filter-btn {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-secondary);
    border-radius: 6px;
    height: 30px;
    padding: 0 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .notif-filter-btn:hover { background: var(--panel-bg-alt); color: var(--text-primary); }
  .notif-panel {
    position: absolute;
    top: 36px;
    right: 0;
    z-index: 50;
    background: var(--panel-bg);
    border: 1px solid var(--divider);
    border-radius: 8px;
    padding: 12px 14px;
    min-width: 230px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .notif-panel-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .notif-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-primary);
    cursor: pointer;
  }
  .notif-panel input { accent-color: var(--sec-color, var(--amber)); width: 16px; height: 16px; cursor: pointer; }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .notif-panel-hint { font-size: 0.72rem; color: var(--text-secondary); line-height: 1.4; }

  /* ---------- Tempo de carregamento ---------- */
  .timer-live {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 800;
    color: #1a1300;
    background: var(--amber);
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .timer-live .timer-ini { font-weight: 600; font-size: 0.7rem; opacity: 0.8; margin-left: 4px; }
  .timer-live.t-30 { background: #ff8c1a; }           /* passou de 30 min */
  .timer-live.t-60 { background: var(--red); color: #fff; } /* passou de 1 h */
  .timer-done {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--green);
    white-space: nowrap;
  }
  .stat-line.tempo { color: var(--green); }

  .tempo-btn {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-primary);
    border-radius: 6px;
    height: 30px;
    padding: 0 10px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .tempo-btn:hover { background: var(--panel-bg-alt); }

  .tempo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 6vh 16px 16px;
    overflow-y: auto;
  }
  .tempo-modal {
    background: var(--panel-bg);
    border: 1px solid var(--divider);
    border-radius: 12px;
    width: 100%;
    max-width: 760px;
    padding: 20px 22px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .tempo-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .tempo-head h2 { margin: 0; font-size: 1.05rem; letter-spacing: 0.04em; }
  .tempo-head .sub { font-size: 0.78rem; color: var(--text-secondary); }
  .tempo-kpis {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  @media (max-width: 600px) { .tempo-kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    background: var(--panel-bg-alt);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .kpi-label { font-size: 0.68rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi-value { font-family: var(--mono); font-weight: 800; font-size: 1.15rem; margin-top: 4px; }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.green { color: var(--green); }
  .tempo-sec-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 14px 0 8px;
  }
  .rank-row {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--panel-bg-alt);
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 3px solid var(--accent, var(--divider));
  }
  .rank-pos { font-family: var(--mono); font-weight: 800; color: var(--text-secondary); text-align: center; }
  .rank-main { min-width: 0; }
  .rank-desc { font-weight: 700; font-size: 0.86rem; overflow-wrap: break-word; }
  .rank-meta { font-family: var(--mono); font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
  .rank-bar { height: 4px; background: var(--panel-bg-hover); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .rank-bar > span { display: block; height: 100%; background: var(--accent, var(--amber)); }
  .rank-dur { font-family: var(--mono); font-weight: 800; font-size: 1rem; white-space: nowrap; }
  .rank-dur.live { color: var(--amber); }
  .rank-tempo { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .rank-ton { font-family: var(--mono); font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap; }
  .tempo-empty { color: var(--text-secondary); font-size: 0.85rem; padding: 14px 4px; text-align: center; }
  .tempo-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tempo-chip {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .tempo-chip.active { color: var(--text-primary); border-color: var(--chip, var(--text-primary)); background: var(--panel-bg-hover); font-weight: 700; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand-group">
      <div>
        <span class="brand-title">QUADRO DE CARGAS</span>
        <span class="brand-sub">Mavaular · Expedição</span>
      </div>
      <div class="col-stats topbar-stats" id="globalStats"></div>
    </div>
    <div class="sync-info">
      <span class="dia-picker">
        <button class="icon-btn-top" id="diaPrevBtn" title="Dia anterior">◀</button>
        <input id="diaQuickInput" class="dia-input" type="number" min="1" max="31" placeholder="hoje" title="Ver outro dia (deixe em branco para acompanhar o dia atual)" />
        <button class="icon-btn-top" id="diaNextBtn" title="Próximo dia">▶</button>
      </span>
      <span id="dayLabel">—</span>
      <div class="view-toggle" id="viewToggle">
        <button class="view-toggle-btn" data-mode="completo">Completo</button>
        <button class="view-toggle-btn" data-mode="simples">Simples</button>
      </div>
      <span class="status-dot" id="statusDot"></span>
      <span id="syncedLabel">aguardando conexão</span>
      <span class="notif-wrap" id="notifWrap" style="display:none;">
        <button class="notif-btn" id="notifBtn"></button>
        <button class="notif-filter-btn" id="notifFilterBtn" title="Escolher de quais seções este computador recebe aviso">▾</button>
        <div class="notif-panel" id="notifPanel" style="display:none;"></div>
      </span>
      <button class="tempo-btn" id="tempoBtn" title="Tempo de carregamento das cargas do dia (do maior para o menor)">⏱ Tempos</button>
      <button class="icon-btn-top" id="refreshBtn" title="Atualizar agora">⟳</button>
      <button class="icon-btn-top" id="settingsBtn" title="Configurar link do Apps Script">⚙</button>
    </div>
  </div>

  <div id="errorBanner" class="error-banner" style="display:none;"></div>

  <div id="configScreen" class="config-screen">
    <h2>Conectar à planilha</h2>
    <p>Cole aqui o link do Apps Script (Web App) implantado na planilha de cargas. Esse link fica salvo neste navegador.</p>
    <input id="urlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec" />
    <button id="connectBtn">Conectar</button>
  </div>

  <div id="board" class="board" style="display:none;"></div>

  <div id="tempoOverlay" class="tempo-overlay" style="display:none;">
    <div class="tempo-modal" id="tempoModal"></div>
  </div>

<script>
  const SECTIONS = [
    { key: 'ENTREGA',   label: 'Entrega',    accent: '#5b8def' },
    { key: 'RETIRA',    label: 'Retira',     accent: '#f2a93b' },
    { key: 'E-COMERCE', label: 'E-commerce', accent: '#b98be8' }
  ];

  // Ordem de exibição dos status ainda não concluídos, do mais avançado (mais perto de carregar)
  // até o mais atrás na fila. '' representa "pendente".
  const ACTIVE_STATUSES = ['INICIADO', 'CHEGOU', 'CHAMADO', ''];
  const GROUP_LABELS = { INICIADO: 'Em andamento', CHEGOU: 'Chegou', CHAMADO: 'Chamado(s)' };
  const STORAGE_KEY = 'quadroCargasConfig';
  const POLL_MS = 20000;

  // Cole aqui o link .../exec do Apps Script para todo mundo que abrir o site
  // já ver o quadro direto, sem precisar colar o link manualmente.
  // Exemplo: 'https://script.google.com/macros/s/AKfycb.../exec'
  // Link FIXO do Apps Script. Na virada do mês NÃO mexa aqui: só troque o NOVO_ID em
  // configurarPlanilha() no Apps Script e execute. Para publicar mudanças no script, use
  // Implantar → Gerenciar implantações → lápis → "Nova versão" (o link continua o mesmo).
  const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytY_8jPnbgB1FUh9GW49ItqcMb9_MponpSXQ64dlNVaE55sOtFPssUzhat2Z5TMu1q/exec';
  // Links antigos/de teste: quem tiver um destes salvo no navegador volta para o link fixo acima.
  const URLS_ANTIGAS = [
    'https://script.google.com/macros/s/AKfycbwZNR25R5tbRWoQrQ_jxEXBjzqv_dnE8vMY0DPAwAlirzgOJ4MSaEdsnN66CbKa11z89Q/exec',
    'https://script.google.com/macros/s/AKfycbxOvBvihRIsT6sFUqIjONU4NhZxW28NkcJqf358iTI996kOhNYYis5evogqht1mi3cw/exec'
  ];

  let config = null;
  let items = [];
  let pollTimer = null;
  let viewMode = 'completo';

  // ---------- Notificações no computador ----------
  // Quando alguém muda o status de uma carga, os OUTROS computadores com o site aberto
  // recebem uma notificação do Windows (mesmo com o navegador minimizado ou em outra aba).
  // Quem fez a ação não recebe. As mudanças chegam pela atualização automática (a cada 20 s;
  // com a aba em segundo plano o navegador pode espaçar para até ~1 min).
  const NOTIF_STATUS = {
    CHAMADO:   '🔔 Chamado para a doca',
    CHEGOU:    '🔵 Freteiro chegou',
    INICIADO:  '▶ Carregamento em andamento',
    CARREGADO: '✓ Carregamento concluído'
  };
  const NOTIF_UNDO = {
    'CHAMADO>':           '↺ Chamada cancelada',
    'CHEGOU>':            '↺ Chegada desfeita',
    'INICIADO>':          '↺ Início cancelado',
    'CARREGADO>INICIADO': '↺ Conclusão desfeita',
    'CARREGADO>':         '↺ Conclusão desfeita'
  };
  const LOCAL_IGNORE_MS = 60000;  // mudanças feitas neste computador não geram aviso aqui
  let knownStatus = null;         // { id: status } da última leitura; null = ainda sem referência
  let knownSheet = null;          // aba atual; ao trocar de dia a referência é refeita sem aviso
  const localChanges = {};        // { id: {from, to, t} } das ações feitas neste computador

  function notifSupported() { return 'Notification' in window; }

  // Filtro por seção — vale só para este computador (fica salvo no navegador).
  const NOTIF_SECOES_KEY = 'quadroCargasNotifSecoes';
  let notifSecoes = SECTIONS.map(s => s.key);
  try {
    const saved = JSON.parse(localStorage.getItem(NOTIF_SECOES_KEY));
    if (Array.isArray(saved)) notifSecoes = saved.filter(k => SECTIONS.some(s => s.key === k));
  } catch (e) {}
  function saveNotifSecoes() {
    try { localStorage.setItem(NOTIF_SECOES_KEY, JSON.stringify(notifSecoes)); } catch (e) {}
  }
  function notifSecoesLabel() {
    if (notifSecoes.length === SECTIONS.length) return '';
    if (notifSecoes.length === 0) return 'nenhuma seção';
    return SECTIONS.filter(s => notifSecoes.includes(s.key)).map(s => s.label).join(' + ');
  }

  function buildNotifPanel() {
    const panel = document.getElementById('notifPanel');
    panel.innerHTML = '<span class="notif-panel-title">Receber avisos de</span>';
    SECTIONS.forEach(sec => {
      const label = document.createElement('label');
      label.style.setProperty('--sec-color', sec.accent);
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = notifSecoes.includes(sec.key);
      cb.addEventListener('change', () => {
        notifSecoes = SECTIONS.map(s => s.key).filter(k =>
          k === sec.key ? cb.checked : notifSecoes.includes(k));
        saveNotifSecoes();
        updateNotifBtn();
      });
      const dot = document.createElement('span');
      dot.className = 'notif-dot';
      dot.style.background = sec.accent;
      label.appendChild(cb);
      label.appendChild(dot);
      label.appendChild(document.createTextNode(sec.label));
      panel.appendChild(label);
    });
    const hint = document.createElement('span');
    hint.className = 'notif-panel-hint';
    hint.textContent = 'Vale só para este computador. O quadro continua mostrando todas as seções.';
    panel.appendChild(hint);
  }

  document.getElementById('notifFilterBtn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = document.getElementById('notifPanel');
    if (panel.style.display === 'none') { buildNotifPanel(); panel.style.display = 'flex'; }
    else panel.style.display = 'none';
  });
  document.getElementById('notifPanel').addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => { document.getElementById('notifPanel').style.display = 'none'; });

  function markLocalChange(id, to) {
    const it = items.find(i => i.id === id);
    localChanges[id] = { from: it ? (it.status || '') : '', to: to || '', t: Date.now() };
  }
  // A mudança veio deste próprio computador (confirmação dela, ou leitura antiga chegando atrasada)?
  function isOwnChange(id, st) {
    const lc = localChanges[id];
    if (!lc || Date.now() - lc.t > LOCAL_IGNORE_MS) return false;
    return st === lc.to || st === lc.from;
  }

  function notifTitle(prev, next) {
    return NOTIF_UNDO[prev + '>' + next] || NOTIF_STATUS[next] || null;
  }

  function sendNotification(item, title) {
    if (!notifSupported() || Notification.permission !== 'granted') return;
    const sec = SECTIONS.find(s => s.key === item.secao);
    const parts = [];
    if (item.carga) parts.push('Carga ' + item.carga);
    if (item.descricao) parts.push(item.descricao);
    if (viewMode === 'completo') parts.push(formatPeso(item.peso));
    try {
      const n = new Notification(title + (sec ? ' — ' + sec.label : ''), {
        body: parts.join(' · '),
        requireInteraction: true,
        tag: 'carga-' + item.id + '-' + (item.status || 'pendente') + '-' + Date.now()
      });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { console.warn('Falha ao mostrar notificação:', e); }
  }

  function checkStatusChanges(sheetName) {
    const sheet = sheetName != null ? sheetName : knownSheet;
    const snapshot = {};
    items.forEach(i => { snapshot[i.id] = i.status || ''; });
    if (knownStatus && sheet === knownSheet) {
      items.forEach(i => {
        const st = i.status || '';
        const prev = knownStatus[i.id];
        if (prev === undefined || prev === st) return;
        if (isOwnChange(i.id, st)) return;
        if (!notifSecoes.includes(i.secao)) return;
        const title = notifTitle(prev, st);
        if (title) sendNotification(i, title);
      });
    }
    knownStatus = snapshot;
    knownSheet = sheet;
  }

  // Teste: dispara uma notificação em 10 s para dar tempo de minimizar a janela.
  let notifTestRunning = false;
  function runNotifTest() {
    if (notifTestRunning) return;
    notifTestRunning = true;
    const btn = document.getElementById('notifBtn');
    let left = 10;
    const tick = () => {
      if (left > 0) {
        btn.textContent = '⏳ Minimize agora… ' + left + 's';
        left--;
        setTimeout(tick, 1000);
      } else {
        sendNotification({ id: 'teste', secao: '', carga: '', descricao: 'Se você está vendo isto, as notificações funcionam neste computador.', peso: 0, status: '' }, '✅ Teste de aviso do Quadro de Cargas');
        notifTestRunning = false;
        updateNotifBtn();
      }
    };
    tick();
  }

  function updateNotifBtn() {
    const btn = document.getElementById('notifBtn');
    const wrap = document.getElementById('notifWrap');
    if (!notifSupported()) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const perm = Notification.permission;
    if (perm === 'granted') {
      btn.className = 'notif-btn on';
      const filtro = notifSecoesLabel();
      btn.textContent = filtro ? '🔔 Avisos: ' + filtro : '🔔 Avisos ativos';
      btn.title = 'Este computador recebe notificação quando outra tela mudar uma carga. Clique para testar (a notificação chega em 10 s — minimize a janela para conferir).';
    } else if (perm === 'denied') {
      btn.className = 'notif-btn off';
      btn.textContent = '🔕 Avisos bloqueados';
      btn.title = 'O navegador bloqueou as notificações deste site. Clique no cadeado ao lado do endereço → Notificações → Permitir, e recarregue a página.';
    } else {
      btn.className = 'notif-btn pending';
      btn.textContent = '🔔 Ativar avisos';
      btn.title = 'Clique para receber notificações no computador quando outra tela mudar uma carga.';
    }
  }

  document.getElementById('notifBtn').addEventListener('click', async () => {
    if (!notifSupported()) return;
    if (Notification.permission === 'granted') {
      runNotifTest();
      return;
    }
    if (Notification.permission === 'denied') {
      alert('As notificações estão bloqueadas para este site.\n\nClique no cadeado ao lado do endereço do site → Notificações → Permitir, e recarregue a página.');
      return;
    }
    try { await Notification.requestPermission(); } catch (e) {}
    updateNotifBtn();
  });
  try { viewMode = localStorage.getItem('quadroCargasViewMode') || 'completo'; } catch (e) {}

  function loadConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveConfig(url, dia) {
    config = { url, dia: dia || '' };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch (e) {}
  }

  function buildUrl() {
    if (!config || !config.url) return null;
    if (!config.dia) return config.url;
    const sep = config.url.indexOf('?') === -1 ? '?' : '&';
    return config.url + sep + 'dia=' + encodeURIComponent(config.dia);
  }

  function showConfig() {
    document.getElementById('configScreen').style.display = 'block';
    document.getElementById('board').style.display = 'none';
  }
  function showBoard() {
    document.getElementById('configScreen').style.display = 'none';
    document.getElementById('board').style.display = 'grid';
  }

  // Com a janela minimizada o Chrome "congela" os timers da página (até 1 vez por minuto ou menos).
  // Por isso o relógio da atualização roda num Worker, que o navegador não segura do mesmo jeito.
  let pollWorker = null;
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (pollWorker) { pollWorker.terminate(); pollWorker = null; }
  }
  function startPolling() {
    stopPolling();
    try {
      const code = 'let t=null;onmessage=e=>{clearInterval(t);t=setInterval(()=>postMessage(1),e.data);};';
      pollWorker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
      pollWorker.onmessage = () => fetchData();
      pollWorker.postMessage(POLL_MS);
    } catch (e) {
      pollWorker = null;
      pollTimer = setInterval(fetchData, POLL_MS);
    }
  }
  // Ao voltar para a janela, atualiza na hora.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && config && config.url) fetchData();
  });

  document.getElementById('connectBtn').addEventListener('click', () => {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;
    saveConfig(url, config ? config.dia : '');
    showBoard();
    fetchData();
    startPolling();
  });

  document.getElementById('settingsBtn').addEventListener('click', () => {
    stopPolling();
    document.getElementById('urlInput').value = config ? config.url : '';
    showConfig();
  });

  document.getElementById('refreshBtn').addEventListener('click', fetchData);

  function applyViewToggleUI() {
    document.querySelectorAll('.view-toggle-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === viewMode);
    });
  }
  document.querySelectorAll('.view-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      viewMode = btn.dataset.mode;
      try { localStorage.setItem('quadroCargasViewMode', viewMode); } catch (e) {}
      applyViewToggleUI();
      render();
    });
  });

  function currentDiaNumber() {
    if (config && config.dia) return parseInt(config.dia, 10);
    const label = document.getElementById('dayLabel').textContent || '';
    const match = label.match(/(\d+)/);
    return match ? parseInt(match[1], 10) : new Date().getDate();
  }

  function applyDia(newDia) {
    const diaStr = newDia === '' || newDia == null ? '' : String(newDia);
    document.getElementById('diaQuickInput').value = diaStr;
    saveConfig(config ? config.url : '', diaStr);
    if (config.url) fetchData();
  }

  const diaQuickInput = document.getElementById('diaQuickInput');
  diaQuickInput.addEventListener('change', () => {
    const v = diaQuickInput.value.trim();
    applyDia(v === '' ? '' : parseInt(v, 10));
  });
  diaQuickInput.addEventListener('keydown', e => { if (e.key === 'Enter') diaQuickInput.blur(); });
  document.getElementById('diaPrevBtn').addEventListener('click', () => applyDia(Math.max(1, currentDiaNumber() - 1)));
  document.getElementById('diaNextBtn').addEventListener('click', () => applyDia(Math.min(31, currentDiaNumber() + 1)));

  function setStatusDot(s) {
    document.getElementById('statusDot').className = 'status-dot ' + s;
  }
  function showError(msg) {
    const b = document.getElementById('errorBanner');
    b.textContent = msg;
    b.style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorBanner').style.display = 'none';
  }
  function formatPeso(n) {
    return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kg';
  }
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  async function fetchData() {
    if (!config || !config.url) return;
    setStatusDot('loading');
    try {
      const res = await fetch(buildUrl(), { method: 'GET' });
      const data = await res.json();
      if (data.error) {
        showError(data.error);
        setStatusDot('error');
        return;
      }
      hideError();
      items = data.items || [];
      checkStatusChanges(data.sheetName || '');
      document.getElementById('dayLabel').textContent = data.sheetName || '';
      document.getElementById('syncedLabel').textContent =
        'Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      setStatusDot('ok');
      render();
    } catch (err) {
      showError('Não foi possível falar com a planilha. Confira o link e se o Apps Script foi implantado com acesso "Qualquer pessoa".');
      setStatusDot('error');
    }
  }

  async function postAction(body) {
    const res = await fetch(buildUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  // ---------- Tempo de carregamento ----------
  // O Apps Script grava na planilha a hora do "▶ Iniciar" (coluna T) e do "✓ Concluído" (coluna U)
  // e devolve em cada item como `inicio` e `fim`. Assim todos os computadores veem o mesmo tempo.
  let tempoFiltro = '';  // '' = todas as seções

  function tsOf(v) {
    if (v == null || v === '') return null;
    const t = typeof v === 'number' ? v : Date.parse(v);
    return isNaN(t) ? null : t;
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  // Duração "redonda" para o ranking: 38 min · 1h 05min
  function fmtDur(ms) {
    const min = Math.max(0, Math.round(ms / 60000));
    if (min < 60) return min + ' min';
    return Math.floor(min / 60) + 'h ' + pad2(min % 60) + 'min';
  }
  // Cronômetro ao vivo: 00:12:34
  function fmtClock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
  }
  function fmtHora(t) {
    return new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  // Mesma regra do Apps Script, aplicada na hora para o cronômetro aparecer sem esperar a planilha.
  function applyLocalTempo(it, from, to) {
    const agora = new Date().toISOString();
    if (to === 'INICIADO') {
      if (!(from === 'CARREGADO' && tsOf(it.inicio))) it.inicio = agora;  // desfazer conclusão mantém o início
      it.fim = '';
    } else if (to === 'CARREGADO') {
      if (!tsOf(it.inicio)) it.inicio = agora;
      it.fim = agora;
    } else {
      it.inicio = '';
      it.fim = '';
    }
  }
  // ---------- Cronômetro local (quando o Apps Script não envia início/fim) ----------
  // O quadro anota no navegador a hora em que viu a carga entrar em "Em andamento" (ou em que
  // alguém clicou ▶ neste computador) e a hora do ✓. Se o script mandar inicio/fim, vale o do script.
  // Carga que já estava em andamento quando o quadro abriu conta "a partir de agora" (marcada com ~).
  const LOCAL_TEMPO_KEY = 'quadroCargasTempoLocal';
  let tempoLocal = {};
  try { tempoLocal = JSON.parse(localStorage.getItem(LOCAL_TEMPO_KEY)) || {}; } catch (e) { tempoLocal = {}; }
  const statusVisto = {};  // último status visto por carga nesta tela
  function salvarTempoLocal() {
    const limite = Date.now() - 3 * 86400000; // guarda só 3 dias
    Object.keys(tempoLocal).forEach(k => { if ((tempoLocal[k].t || 0) < limite) delete tempoLocal[k]; });
    try { localStorage.setItem(LOCAL_TEMPO_KEY, JSON.stringify(tempoLocal)); } catch (e) {}
  }
  function chaveLocal(id) { return (document.getElementById('dayLabel').textContent || '') + '|' + id; }
  // Chamado quando ESTE computador muda o status.
  function marcarTempoLocal(id, to) {
    const k = chaveLocal(id), agora = Date.now();
    if (to === 'INICIADO') {
      if (!tempoLocal[k]) tempoLocal[k] = { t: agora, aprox: false };
      delete tempoLocal[k].f;
    } else if (to === 'CARREGADO') {
      tempoLocal[k] = tempoLocal[k] || { t: agora, aprox: false };
      tempoLocal[k].f = agora;
    } else {
      delete tempoLocal[k];
    }
    salvarTempoLocal();
  }
  // Completa inicio/fim das cargas com o que o quadro anotou.
  function completarTempos() {
    const agora = Date.now();
    let mudou = false;
    items.forEach(it => {
      const st = it.status || '';
      const k = chaveLocal(it.id);
      const antes = statusVisto[k];
      statusVisto[k] = st;
      if (tsOf(it.inicio)) return; // o script já mandou: usa o dele
      let reg = tempoLocal[k];
      if (st === 'INICIADO') {
        if (!reg) { reg = tempoLocal[k] = { t: agora, aprox: antes === undefined }; mudou = true; }
        if (reg.f) { delete reg.f; mudou = true; }
      } else if (st === 'CARREGADO') {
        if (reg && !reg.f) { reg.f = antes === 'INICIADO' || antes === undefined ? agora : agora; mudou = true; }
      } else if (reg) {
        delete tempoLocal[k]; reg = null; mudou = true;
      }
      if (reg && (st === 'INICIADO' || st === 'CARREGADO')) {
        it.inicio = new Date(reg.t).toISOString();
        it.inicioAprox = !!reg.aprox;
        if (st === 'CARREGADO' && reg.f && !tsOf(it.fim)) it.fim = new Date(reg.f).toISOString();
      }
    });
    if (mudou) salvarTempoLocal();
  }

  // Cronômetro do card em andamento: "⏱ 00:12:34 desde 08:02" (laranja após 30 min, vermelho após 1 h)
  function timerLiveHtml(ini, aprox) {
    const min = (Date.now() - ini) / 60000;
    const cls = min >= 60 ? ' t-60' : (min >= 30 ? ' t-30' : '');
    const titulo = aprox
      ? 'Já estava em andamento quando o quadro abriu: contando a partir de ' + fmtHora(ini) + ' (o início real pode ter sido antes)'
      : 'Carregando há este tempo (início às ' + fmtHora(ini) + ')';
    return '<span class="timer-live' + cls + '" title="' + titulo + '" data-inicio="' + ini + '">' +
      '⏱ <span class="timer-clk">' + fmtClock(Date.now() - ini) + '</span><span class="timer-ini">desde ' + (aprox ? '~' : '') + fmtHora(ini) + '</span></span>';
  }

  function duracaoCarga(it) {
    const ini = tsOf(it.inicio), fim = tsOf(it.fim);
    if (it.status === 'CARREGADO' && ini && fim && fim >= ini) return fim - ini;
    return null;
  }

  // Minutos por tonelada: tempo total ÷ toneladas das cargas que têm tempo registrado.
  function porTonelada(ms, kg) {
    if (!ms || !(kg > 0)) return '—';
    return fmtDur(ms / (kg / 1000)) + '/t';
  }

  // Tempo da carga + tempo por tonelada daquela carga, alinhados à direita da linha do ranking.
  function rankTempoHtml(ms, kg) {
    return '<span class="rank-tempo"><span class="rank-dur">' + fmtDur(ms) + '</span>' +
      '<span class="rank-ton" title="Tempo desta carga ÷ toneladas desta carga">' + porTonelada(ms, Number(kg) || 0) + '</span></span>';
  }

  function tempoStats(lista) {
    const done = lista.map(i => ({ item: i, ms: duracaoCarga(i) })).filter(x => x.ms != null)
      .sort((a, b) => b.ms - a.ms);
    const total = done.reduce((s, x) => s + x.ms, 0);
    return { done, total, media: done.length ? total / done.length : 0 };
  }

  // Atualiza todos os cronômetros na tela a cada segundo.
  setInterval(() => {
    const now = Date.now();
    document.querySelectorAll('[data-inicio]').forEach(el => {
      const ini = Number(el.dataset.inicio);
      const clk = el.querySelector('.timer-clk');
      if (clk) clk.textContent = fmtClock(now - ini); else el.textContent = (el.dataset.prefix || '') + fmtClock(now - ini);
      if (el.classList.contains('timer-live')) {
        const min = (now - ini) / 60000;
        el.classList.toggle('t-30', min >= 30 && min < 60);
        el.classList.toggle('t-60', min >= 60);
      }
    });
  }, 1000);

  // ---------- Indicador mensal (lê a planilha de Histórico pelo Apps Script) ----------
  let tempoModo = 'dia';  // 'dia' | 'mes'
  let tempoMes = new Date().getFullYear() + '-' + pad2(new Date().getMonth() + 1);
  let mesDados = null;    // { mes, itens }
  let mesCarregando = false, mesErro = '';

  async function carregarMes(force) {
    if (!config || !config.url) return;
    if (!force && mesDados && mesDados.mes === tempoMes) return;
    mesCarregando = true; mesErro = '';
    renderTempoModal();
    try {
      const sep = config.url.indexOf('?') === -1 ? '?' : '&';
      const res = await fetch(config.url + sep + 'historico=' + encodeURIComponent(tempoMes));
      const data = await res.json();
      if (data.error) mesErro = data.error;
      else if (!Array.isArray(data.itens)) {
        // O link respondeu as cargas do dia: a implantação no ar ainda é a versão antiga do script.
        mesErro = 'O Apps Script no ar ainda é a versão antiga e não lê o histórico. ' +
          'No Apps Script: Implantar → Gerenciar implantações → lápis → Versão: "Nova versão" → Implantar.';
      }
      else mesDados = { mes: tempoMes, itens: data.itens };
    } catch (e) {
      mesErro = 'Não foi possível ler o histórico.';
    }
    mesCarregando = false;
    renderTempoModal();
  }

  function fmtData(iso) {
    const p = String(iso || '').split('-');
    return p.length === 3 ? p[2] + '/' + p[1] : '';
  }

  function htmlMes() {
    let html = '<div class="tempo-filter" style="align-items:center">' +
      '<input type="month" id="tempoMesInput" class="dia-input" style="width:150px" value="' + tempoMes + '" />' +
      '<button class="tempo-chip" id="tempoMesRefresh" title="Atualizar">⟳</button></div>';
    if (mesCarregando) return html + '<div class="tempo-empty">Carregando histórico…</div>';
    if (mesErro) return html + '<div class="tempo-empty">' + escapeHtml(mesErro) + '</div>';
    if (!mesDados) return html;

    const todos = mesDados.itens.filter(i => !tempoFiltro || i.secao === tempoFiltro);
    const comTempo = todos.filter(i => i.minutos != null).sort((a, b) => b.minutos - a.minutos);
    const pesoTotal = todos.reduce((s, i) => s + i.peso, 0);
    const minTotal = comTempo.reduce((s, i) => s + i.minutos, 0);
    const media = comTempo.length ? minTotal / comTempo.length : 0;
    const maxMin = comTempo.length ? comTempo[0].minutos || 1 : 1;

    html += '<div class="tempo-kpis">' +
      '<div class="kpi"><div class="kpi-label">Cargas concluídas</div><div class="kpi-value">' + todos.length + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Peso carregado</div><div class="kpi-value" style="font-size:0.95rem">' + formatPeso(pesoTotal) + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Tempo total gasto</div><div class="kpi-value green">' + (comTempo.length ? fmtDur(minTotal * 60000) : '—') + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Média por carga</div><div class="kpi-value">' + (comTempo.length ? fmtDur(media * 60000) : '—') + '</div></div>' +
      '<div class="kpi" title="Tempo total ÷ toneladas das cargas com tempo registrado"><div class="kpi-label">Tempo por tonelada</div><div class="kpi-value">' + porTonelada(minTotal * 60000, comTempo.reduce((s, i) => s + i.peso, 0)) + '</div></div>' +
      '</div>';

    html += '<div class="tempo-sec-title">Cargas do mês — do maior para o menor tempo</div>';
    if (!comTempo.length) {
      html += '<div class="tempo-empty">Nenhuma carga com tempo registrado neste mês.</div>';
    } else {
      comTempo.forEach((it, idx) => {
        const sec = SECTIONS.find(s => s.key === it.secao);
        const ini = tsOf(it.inicio), fim = tsOf(it.fim);
        html += '<div class="rank-row" style="--accent:' + (sec ? sec.accent : 'var(--divider)') + '">' +
          '<span class="rank-pos">' + (idx + 1) + 'º</span>' +
          '<div class="rank-main"><div class="rank-desc">' + escapeHtml(it.descricao) + '</div>' +
          '<div class="rank-meta">' + fmtData(it.data) + ' · Carga ' + escapeHtml(it.carga || '—') + ' · ' + (sec ? sec.label : escapeHtml(it.secao)) +
          (ini && fim ? ' · ' + fmtHora(ini) + ' → ' + fmtHora(fim) : '') + ' · ' + formatPeso(it.peso) + '</div>' +
          '<div class="rank-bar"><span style="width:' + Math.max(3, Math.round(it.minutos / maxMin * 100)) + '%"></span></div></div>' +
          rankTempoHtml(it.minutos * 60000, it.peso) + '</div>';
      });
    }
    const semTempo = todos.length - comTempo.length;
    if (semTempo) html += '<div class="tempo-empty">' + semTempo + ' carga(s) concluída(s) sem horário de início (entram no peso, não no tempo).</div>';
    return html;
  }

  function renderTempoModal() {
    const overlay = document.getElementById('tempoOverlay');
    if (overlay.style.display === 'none') return;
    const modal = document.getElementById('tempoModal');
    if (tempoModo === 'mes') {
      // Não redesenha enquanto alguém escolhe o mês (o quadro atualiza a cada 20 s).
      if (document.activeElement && document.activeElement.id === 'tempoMesInput') return;
      modal.innerHTML =
        '<div class="tempo-head"><div><h2>📅 INDICADOR MENSAL</h2>' +
        '<span class="sub">Histórico de cargas concluídas · maior → menor tempo</span></div>' +
        '<button class="icon-btn-top" id="tempoClose" title="Fechar">✕</button></div>' +
        modoToggleHtml() + filtroHtml() + htmlMes();
      bindTempoModal();
      const inp = document.getElementById('tempoMesInput');
      if (inp) inp.addEventListener('change', () => { if (inp.value) { tempoMes = inp.value; carregarMes(true); } });
      const rf = document.getElementById('tempoMesRefresh');
      if (rf) rf.addEventListener('click', () => carregarMes(true));
      return;
    }
    const lista = items.filter(i => !tempoFiltro || i.secao === tempoFiltro);
    const st = tempoStats(lista);
    const andamento = lista.filter(i => i.status === 'INICIADO' && tsOf(i.inicio))
      .sort((a, b) => tsOf(a.inicio) - tsOf(b.inicio));
    const semTempo = lista.filter(i => i.status === 'CARREGADO' && duracaoCarga(i) == null).length;
    const maxMs = st.done.length ? st.done[0].ms : 1;
    const dia = document.getElementById('dayLabel').textContent || '';

    let html =
      '<div class="tempo-head"><div><h2>⏱ TEMPO DE CARREGAMENTO</h2>' +
      '<span class="sub">' + escapeHtml(dia) + ' · do ▶ Iniciar até o ✓ Concluído · maior → menor</span></div>' +
      '<button class="icon-btn-top" id="tempoClose" title="Fechar">✕</button></div>';

    html += modoToggleHtml() + filtroHtml();

    const maior = st.done.length ? fmtDur(st.done[0].ms) : '—';
    const menor = st.done.length ? fmtDur(st.done[st.done.length - 1].ms) : '—';
    html += '<div class="tempo-kpis">' +
      '<div class="kpi"><div class="kpi-label">Cargas concluídas</div><div class="kpi-value">' + st.done.length + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Tempo total</div><div class="kpi-value green">' + (st.done.length ? fmtDur(st.total) : '—') + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Média por carga</div><div class="kpi-value">' + (st.done.length ? fmtDur(st.media) : '—') + '</div></div>' +
      '<div class="kpi" title="Tempo total ÷ toneladas das cargas com tempo registrado"><div class="kpi-label">Tempo por tonelada</div><div class="kpi-value">' + porTonelada(st.total, st.done.reduce((s, x) => s + (Number(x.item.peso) || 0), 0)) + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Maior / menor</div><div class="kpi-value amber" style="font-size:0.85rem;white-space:nowrap">' + maior + ' / ' + menor + '</div></div>' +
      '</div>';

    if (andamento.length) {
      html += '<div class="tempo-sec-title">Em andamento agora</div>';
      andamento.forEach(it => {
        const sec = SECTIONS.find(s => s.key === it.secao);
        const ini = tsOf(it.inicio);
        html += '<div class="rank-row" style="--accent:' + (sec ? sec.accent : 'var(--amber)') + '">' +
          '<span class="rank-pos">▶</span>' +
          '<div class="rank-main"><div class="rank-desc">' + escapeHtml(it.descricao) + '</div>' +
          '<div class="rank-meta">Carga ' + escapeHtml(it.carga || '—') + ' · ' + (sec ? sec.label : '') +
          ' · início ' + fmtHora(ini) + '</div></div>' +
          '<span class="rank-dur live" data-inicio="' + ini + '">' + fmtClock(Date.now() - ini) + '</span></div>';
      });
    }

    html += '<div class="tempo-sec-title">Concluídas — do maior para o menor tempo</div>';
    if (!st.done.length) {
      html += '<div class="tempo-empty">Nenhuma carga concluída com tempo registrado neste dia.</div>';
    } else {
      st.done.forEach((x, idx) => {
        const it = x.item;
        const sec = SECTIONS.find(s => s.key === it.secao);
        html += '<div class="rank-row" style="--accent:' + (sec ? sec.accent : 'var(--divider)') + '">' +
          '<span class="rank-pos">' + (idx + 1) + 'º</span>' +
          '<div class="rank-main"><div class="rank-desc">' + escapeHtml(it.descricao) + '</div>' +
          '<div class="rank-meta">Carga ' + escapeHtml(it.carga || '—') + ' · ' + (sec ? sec.label : '') +
          ' · ' + fmtHora(tsOf(it.inicio)) + ' → ' + fmtHora(tsOf(it.fim)) +
          (viewMode === 'completo' ? ' · ' + formatPeso(it.peso) : '') + '</div>' +
          '<div class="rank-bar"><span style="width:' + Math.max(3, Math.round(x.ms / maxMs * 100)) + '%"></span></div></div>' +
          rankTempoHtml(x.ms, it.peso) + '</div>';
      });
    }
    if (semTempo) {
      html += '<div class="tempo-empty">' + semTempo + ' carga(s) concluída(s) sem horário registrado (concluídas antes desta função ou marcadas direto na planilha).</div>';
    }

    modal.innerHTML = html;
    bindTempoModal();
  }

  function modoToggleHtml() {
    return '<div class="view-toggle" style="display:inline-flex;margin-bottom:12px">' +
      '<button class="view-toggle-btn' + (tempoModo === 'dia' ? ' active' : '') + '" data-modo="dia">Dia</button>' +
      '<button class="view-toggle-btn' + (tempoModo === 'mes' ? ' active' : '') + '" data-modo="mes">Mês</button></div>';
  }
  function filtroHtml() {
    return '<div class="tempo-filter">' +
      '<button class="tempo-chip' + (tempoFiltro === '' ? ' active' : '') + '" data-sec="">Todas</button>' +
      SECTIONS.map(s => '<button class="tempo-chip' + (tempoFiltro === s.key ? ' active' : '') +
        '" data-sec="' + s.key + '" style="--chip:' + s.accent + '">' + s.label + '</button>').join('') +
      '</div>';
  }
  function bindTempoModal() {
    const modal = document.getElementById('tempoModal');
    document.getElementById('tempoClose').addEventListener('click', closeTempoModal);
    modal.querySelectorAll('.tempo-chip[data-sec]').forEach(b => b.addEventListener('click', () => {
      tempoFiltro = b.dataset.sec;
      renderTempoModal();
    }));
    modal.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => {
      tempoModo = b.dataset.modo;
      renderTempoModal();
      if (tempoModo === 'mes') carregarMes(false);
    }));
  }
  function openTempoModal() {
    document.getElementById('tempoOverlay').style.display = 'flex';
    renderTempoModal();
    if (tempoModo === 'mes') carregarMes(true);
  }
  function closeTempoModal() {
    document.getElementById('tempoOverlay').style.display = 'none';
  }
  document.getElementById('tempoBtn').addEventListener('click', openTempoModal);
  document.getElementById('tempoOverlay').addEventListener('click', e => {
    if (e.target.id === 'tempoOverlay') closeTempoModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTempoModal(); });

  async function setItemStatus(id, status) {
    markLocalChange(id, status);
    const it = items.find(i => i.id === id);
    marcarTempoLocal(id, status);
    if (it) { applyLocalTempo(it, it.status || '', status); it.status = status; }
    render(id);
    try {
      const data = await postAction({ action: 'setStatus', id, status });
      if (data.items) { items = data.items; render(); }
    } catch (e) { fetchData(); }
  }

  async function setStatusAndPromote(item, newStatus) {
    markLocalChange(item.id, newStatus);
    const secActive = items
      .filter(i => i.secao === item.secao && i.status !== 'CARREGADO')
      .sort((a, b) => a.ordem - b.ordem);
    const inProgress = secActive.filter(i => i.status === 'INICIADO');
    const others = secActive.filter(i => i.status !== 'INICIADO' && i.id !== item.id);
    const newOrderIds = [...inProgress.map(i => i.id), item.id, ...others.map(i => i.id)];
    newOrderIds.forEach((id, idx) => {
      const it = items.find(i => i.id === id);
      if (it) it.ordem = idx + 1;
    });
    const target = items.find(i => i.id === item.id);
    marcarTempoLocal(item.id, newStatus);
    if (target) { applyLocalTempo(target, target.status || '', newStatus); target.status = newStatus; }
    render(item.id);
    try {
      await postAction({ action: 'reorder', order: newOrderIds });
      const data = await postAction({ action: 'setStatus', id: item.id, status: newStatus });
      if (data.items) { items = data.items; render(); }
    } catch (e) { fetchData(); }
  }

  async function setPosition(item, rawValue) {
    const target = parseInt(rawValue, 10);
    const secAll = items.filter(i => i.secao === item.secao && i.status !== 'CARREGADO');
    const groups = {};
    ACTIVE_STATUSES.forEach(key => {
      groups[key] = secAll.filter(i => (i.status || '') === key).sort((a, b) => a.ordem - b.ordem);
    });

    const itemStatus = item.status || '';
    const group = groups[itemStatus];
    let offset = 0;
    for (const key of ACTIVE_STATUSES) {
      if (key === itemStatus) break;
      offset += groups[key].length;
    }

    if (isNaN(target) || !group || group.length === 0) { render(); return; }

    let idxTarget = target - offset; // posição 1-based dentro do próprio grupo
    idxTarget = Math.max(1, Math.min(group.length, idxTarget));

    const withoutItem = group.filter(i => i.id !== item.id);
    withoutItem.splice(idxTarget - 1, 0, item);
    groups[itemStatus] = withoutItem;

    const newOrderIds = ACTIVE_STATUSES.flatMap(key => groups[key].map(i => i.id));
    newOrderIds.forEach((id, idx) => {
      const it = items.find(i => i.id === id);
      if (it) it.ordem = idx + 1;
    });

    render(item.id);
    try {
      const data = await postAction({ action: 'reorder', order: newOrderIds });
      if (data.items) { items = data.items; render(); }
    } catch (e) { fetchData(); }
  }

  function mkBtn(icon, label, onClick) {
    const b = document.createElement('button');
    b.className = 'icon-btn';
    b.innerHTML = icon;
    b.title = label;
    b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    return b;
  }

  function buildCard(item, isFirstPending, highlightId, position) {
    const status = item.status || '';
    const card = document.createElement('div');
    card.className = 'card'
      + (status === 'CARREGADO' ? ' loaded' : '')
      + (status === 'INICIADO' ? ' in-progress' : '')
      + (status === 'CHAMADO' ? ' called' : '')
      + (status === 'CHEGOU' ? ' arrived' : '')
      + (item.id === highlightId ? ' flip' : '');
    card.innerHTML =
      (position != null ? '<input type="number" class="position-badge" value="' + position + '" min="1" />' : '') +
      '<span class="carga-chip">' + escapeHtml(item.carga || '—') + '</span>' +
      '<span class="descricao">' + escapeHtml(item.descricao) + '</span>' +
      (status === 'INICIADO' ? '<span class="badge-progress">EM ANDAMENTO</span>' : '') +
      (duracaoCarga(item) != null
        ? '<span class="timer-done" title="Tempo de carregamento (' + fmtHora(tsOf(item.inicio)) + ' → ' + fmtHora(tsOf(item.fim)) + ')">⏱ ' + fmtDur(duracaoCarga(item)) + '</span>' : '') +
      (status === 'CHAMADO' ? '<span class="badge-called">🔔 IR PARA DOCA</span>' : '') +
      (status === 'CHEGOU' ? '<span class="badge-arrived">🔵 CHEGOU</span>' : '') +
      '<span class="peso">' + formatPeso(item.peso) + '</span>' +
      '<span class="actions"></span>';

    if (position != null) {
      const posInput = card.querySelector('.position-badge');
      posInput.addEventListener('click', e => { e.stopPropagation(); posInput.select(); });
      posInput.addEventListener('keydown', e => { if (e.key === 'Enter') posInput.blur(); });
      posInput.addEventListener('change', () => setPosition(item, posInput.value));
    }

    const actions = card.querySelector('.actions');

    if (status === 'CARREGADO') {
      actions.appendChild(mkBtn('↺', 'Desfazer conclusão', () => setItemStatus(item.id, 'INICIADO')));
    } else if (status === 'INICIADO') {
      actions.appendChild(mkBtn('↺', 'Cancelar início', () => setItemStatus(item.id, '')));
      actions.appendChild(mkBtn('✓', 'Marcar concluído', () => setItemStatus(item.id, 'CARREGADO')));
    } else if (status === 'CHEGOU') {
      actions.appendChild(mkBtn('↺', 'Desfazer chegada', () => setItemStatus(item.id, '')));
      actions.appendChild(mkBtn('▶', 'Iniciar carregamento', () => setItemStatus(item.id, 'INICIADO')));
    } else if (status === 'CHAMADO') {
      actions.appendChild(mkBtn('↺', 'Cancelar chamada', () => setItemStatus(item.id, '')));
      actions.appendChild(mkBtn('🔵', 'Freteiro chegou', () => setStatusAndPromote(item, 'CHEGOU')));
      actions.appendChild(mkBtn('▶', 'Iniciar carregamento', () => setItemStatus(item.id, 'INICIADO')));
    } else {
      actions.appendChild(mkBtn('🔔', 'Chamar para a doca', () => setStatusAndPromote(item, 'CHAMADO')));
      actions.appendChild(mkBtn('🔵', 'Freteiro chegou', () => setStatusAndPromote(item, 'CHEGOU')));
      actions.appendChild(mkBtn('▶', 'Iniciar carregamento', () => setItemStatus(item.id, 'INICIADO')));
    }
    return card;
  }

  function statLine(prefix, count, kg) {
    let line = prefix + ': ' + count + ' carga(s)';
    if (viewMode === 'completo') line += ' · ' + formatPeso(kg);
    return line;
  }

  function renderGlobalStats() {
    const totalCount = items.length;
    const totalKg = items.reduce((s, i) => s + i.peso, 0);
    const pendingItems = items.filter(i => i.status !== 'CARREGADO');
    const pendingCount = pendingItems.length;
    const pendingKg = pendingItems.reduce((s, i) => s + i.peso, 0);
    document.getElementById('globalStats').innerHTML =
      '<span class="stat-line">' + statLine('Hoje', totalCount, totalKg) + '</span>' +
      '<span class="stat-line pending">' + statLine('Pendente', pendingCount, pendingKg) + '</span>' +
      tempoLine(items);
  }

  // Linha "Tempo" nas estatísticas: total gasto nas concluídas + média por carga.
  function tempoLine(lista) {
    const st = tempoStats(lista);
    if (!st.done.length) return '';
    return '<span class="stat-line tempo">Tempo: ' + fmtDur(st.total) + ' · média ' + fmtDur(st.media) + '</span>';
  }

  function render(highlightId) {
    completarTempos();
    if (knownStatus) checkStatusChanges();
    renderGlobalStats();
    const board = document.getElementById('board');
    board.innerHTML = '';
    SECTIONS.forEach(sec => {
      const secItems = items.filter(i => i.secao === sec.key);
      const groups = {};
      ACTIVE_STATUSES.forEach(key => {
        groups[key] = secItems.filter(i => (i.status || '') === key).sort((a, b) => a.ordem - b.ordem);
      });
      const loaded = secItems.filter(i => i.status === 'CARREGADO').sort((a, b) => a.ordem - b.ordem);

      const totalCount = secItems.length;
      const totalKg = secItems.reduce((s, i) => s + i.peso, 0);
      const activeAll = ACTIVE_STATUSES.flatMap(key => groups[key]);
      const pendingCount = activeAll.length;
      const pendingKg = activeAll.reduce((s, i) => s + i.peso, 0);

      const col = document.createElement('div');
      col.className = 'column';
      col.style.setProperty('--accent', sec.accent);

      const header = document.createElement('div');
      header.className = 'column-header';
      header.innerHTML =
        '<span class="col-title">' + sec.label + '</span>' +
        '<div class="col-stats">' +
          '<span class="stat-line">' + statLine('Hoje', totalCount, totalKg) + '</span>' +
          '<span class="stat-line pending">' + statLine('Pendente', pendingCount, pendingKg) + '</span>' +
          tempoLine(secItems) +
        '</div>';
      col.appendChild(header);

      const list = document.createElement('div');
      list.className = 'card-list';

      let runningOffset = 0;
      ACTIVE_STATUSES.forEach(key => {
        const group = groups[key];
        if (group.length === 0) return;
        if (GROUP_LABELS[key]) {
          const label = document.createElement('div');
          label.className = 'group-label';
          label.textContent = GROUP_LABELS[key];
          list.appendChild(label);
        }
        const offsetForGroup = runningOffset;
        group.forEach((item, idx) => list.appendChild(buildCard(item, idx === 0, highlightId, offsetForGroup + idx + 1)));
        runningOffset += group.length;
      });

      if (activeAll.length === 0) {
        list.innerHTML += '<div class="empty-state">Nenhuma carga pendente nesta seção.</div>';
      }
      col.appendChild(list);

      const toggle = document.createElement('div');
      toggle.className = 'loaded-toggle';
      toggle.textContent = 'Carregados (' + loaded.length + ') ▾';
      col.appendChild(toggle);

      const loadedList = document.createElement('div');
      loadedList.className = 'loaded-list';
      loadedList.style.display = 'none';
      loaded.forEach(item => loadedList.appendChild(buildCard(item, false, highlightId)));
      col.appendChild(loadedList);

      toggle.addEventListener('click', () => {
        const isHidden = loadedList.style.display === 'none';
        loadedList.style.display = isHidden ? 'flex' : 'none';
        toggle.textContent = 'Carregados (' + loaded.length + ') ' + (isHidden ? '▴' : '▾');
      });

      board.appendChild(col);
    });
    renderTempoModal();
  }

  function init() {
    applyViewToggleUI();
    updateNotifBtn();
    config = loadConfig();
    // Computadores que guardaram um link antigo passam a usar o link atual automaticamente.
    if (config && URLS_ANTIGAS.indexOf(config.url) !== -1 && config.url !== DEFAULT_APPS_SCRIPT_URL) {
      saveConfig(DEFAULT_APPS_SCRIPT_URL, config.dia);
    }
    if (!config && DEFAULT_APPS_SCRIPT_URL) {
      config = { url: DEFAULT_APPS_SCRIPT_URL, dia: '' };
    }
    if (config && config.dia) {
      document.getElementById('diaQuickInput').value = config.dia;
    }
    if (config && config.url) {
      showBoard();
      fetchData();
      startPolling();
    } else {
      showConfig();
    }
  }

  init();
</script>
</body>
</html>
